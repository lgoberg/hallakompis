<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="En kompis som vinker">
  <style>
    /* Armen vinker, men bare av og til: mesteparten av tida står den i ro,
       ellers blir den maset paa en side folk ser paa hver dag. */
    @keyframes vink{
      0%, 62%, 100% { transform: rotate(0deg); }
      68% { transform: rotate(-26deg); }
      75% { transform: rotate(6deg); }
      82% { transform: rotate(-20deg); }
      90% { transform: rotate(0deg); }
    }
    .arm{ transform-origin: 96px 72px; animation: vink 4.5s ease-in-out infinite; }

    /* Blikket flytter seg i korte rykk med lange pauser, slik ekte oyne gjoer.
       Glir de jevnt fram og tilbake, ser han svimmel ut. Pupillen kan flytte
       seg 6 px foer den treffer kanten av det hvite, saa vi holder oss innafor. */
    @keyframes seSegRundt{
      0%, 20%   { transform: translate(0px, 0px); }
      23%, 43%  { transform: translate(-4px, 1px); }
      46%, 62%  { transform: translate(4px, -1px); }
      65%, 75%  { transform: translate(2px, 3px); }
      78%, 100% { transform: translate(0px, 0px); }
    }
    .pupiller{ animation: seSegRundt 7s steps(1, end) infinite; }

    @media (prefers-reduced-motion: reduce){
      .arm, .pupiller{ animation: none; }
    }
  </style>

  <!-- antenne -->
  <path d="M64 30 V18" stroke="#1b6b5a" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="64" cy="13" r="7" fill="#5fc0a4"/>

  <!-- venstre arm, i ro. Holdes over fothoyde, ellers ser den ut som den
       slepes etter ham. -->
  <path d="M32 72 q-13 3 -16 14" stroke="#1b6b5a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="15" cy="88" r="8" fill="#1b6b5a"/>

  <!-- hoyre arm, den som vinker -->
  <g class="arm">
    <path d="M98 72 q14 -4 20 -18" stroke="#1b6b5a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="50" r="9" fill="#1b6b5a"/>
  </g>

  <!-- kropp -->
  <rect x="26" y="30" width="76" height="70" rx="28" fill="#1b6b5a"/>

  <!-- oyne -->
  <circle cx="49" cy="58" r="11" fill="#f6f4ef"/>
  <circle cx="79" cy="58" r="11" fill="#f6f4ef"/>
  <g class="pupiller">
    <circle cx="49" cy="59" r="5" fill="#16211f"/>
    <circle cx="79" cy="59" r="5" fill="#16211f"/>
  </g>

  <!-- smil -->
  <path d="M50 78 q14 13 28 0" stroke="#f6f4ef" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- foetter, saa han staar -->
  <rect x="40" y="98" width="16" height="12" rx="6" fill="#1b6b5a"/>
  <rect x="72" y="98" width="16" height="12" rx="6" fill="#1b6b5a"/>
</svg>
