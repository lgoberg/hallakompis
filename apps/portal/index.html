<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6b5a">
<title>hallakompis</title>
<meta name="description" content="Småting jeg har laget. Verktøy for familie, venner og naboer.">
<link rel="icon" href="ikon.svg">
<link rel="apple-touch-icon" href="ikon.svg">
<style>
:root{
  --bg:#f6f4ef; --kort:#ffffff; --tekst:#16211f; --svak:#5f6f6b; --kant:#e0dcd2;
  --aksent:#1b6b5a; --aksentMyk:#e7f1ed; --skygge:0 1px 2px rgba(22,33,31,.06), 0 6px 20px rgba(22,33,31,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --kort:#1a201e; --tekst:#e8eeeb; --svak:#94a5a0; --kant:#2a322f;
    --aksent:#5fc0a4; --aksentMyk:#1e2a26; --skygge:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--tekst);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 20px calc(48px + env(safe-area-inset-bottom));
}
.ramme{max-width:820px; margin:0 auto}

header{padding:56px 0 40px; text-align:center}
/* kompisen står over navnet og er stor nok til at man ser at han vinker */
header .mark{width:96px; height:96px; margin:0 auto 14px; display:block}
h1{font-size:40px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
h1 .halla{color:var(--aksent)}
h1 .rop{color:var(--aksent)}
header p{color:var(--svak); margin-top:10px; font-size:17px}
@media (max-width:520px){
  header{padding:40px 0 32px}
  header .mark{width:80px; height:80px}
  h1{font-size:32px}
  header p{font-size:16px}
}

h2{
  font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--svak);
  font-weight:700; margin:36px 0 14px;
}

.liste{display:grid; gap:12px}
@media (min-width:640px){ .liste{grid-template-columns:1fr 1fr} }

.tjeneste{
  display:block; text-decoration:none; color:inherit;
  background:var(--kort); border:1px solid var(--kant); border-radius:16px;
  padding:20px; box-shadow:var(--skygge); position:relative;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
@media (hover: hover) and (pointer: fine){
  .tjeneste:hover{transform:translateY(-2px); border-color:var(--aksent); box-shadow:0 4px 24px rgba(22,33,31,.12)}
}
.tjeneste:active{transform:translateY(0)}
.tjeneste .ikon{font-size:26px; line-height:1; display:block; margin-bottom:12px}
.tjeneste h3{font-size:18px; font-weight:700; margin-bottom:4px}
.tjeneste p{color:var(--svak); font-size:14px}
.tjeneste .pil{position:absolute; top:20px; right:20px; color:var(--kant); font-size:18px}
@media (hover: hover) and (pointer: fine){ .tjeneste:hover .pil{color:var(--aksent)} }

.merke{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; padding:3px 8px; border-radius:999px;
  background:var(--aksentMyk); color:var(--aksent); margin-top:12px;
}
.tjeneste.snart{opacity:.62}
.tjeneste.snart .merke{background:transparent; color:var(--svak); border:1px solid var(--kant)}

footer{margin-top:56px; padding-top:24px; border-top:1px solid var(--kant); color:var(--svak); font-size:13px; text-align:center}
</style>
</head>
<body>
<div class="ramme">

  <header>
    <img class="mark" src="ikon.svg" alt="">
    <h1><span class="halla">halla</span>kompis<span class="rop">!</span></h1>
    <p>jeg hjelper deg å holde styr på saker og ting</p>
  </header>

  <h2 id="overskriftLive" hidden>Tjenester</h2>
  <div class="liste" id="liste"></div>

  <h2 id="overskriftSnart" hidden>På vei</h2>
  <div class="liste" id="listeSnart"></div>

  <footer>hallakompis.no</footer>

</div>

<script>
/* Legg til en ny tjeneste ved å skrive én linje her. Feltet "status" kan være
   'live' for noe som virker nå, eller 'snart' for noe som ikke er klart. */
var TJENESTER = [
  {
    navn: 'Godlia Rundt',
    beskrivelse: 'Tidtaking på idealtid. To runder, og den som sykler likest vinner.',
    adresse: 'https://sykkeltid.hallakompis.no',
    ikon: '🚲',
    status: 'live'
  },
  {
    navn: 'Kompis',
    beskrivelse: 'Min egen assistent. Oppgaver, handleliste og kalender.',
    adresse: 'https://kompis.hallakompis.no',
    ikon: '💬',
    status: 'snart'
  },
  {
    navn: 'Kortspill',
    beskrivelse: 'Spill for familiekvelder. Kommer når noen har bygget dem.',
    adresse: '',
    ikon: '🃏',
    status: 'snart'
  }
];

(function(){
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var live = TJENESTER.filter(function(t){ return t.status === 'live'; });
  var snart = TJENESTER.filter(function(t){ return t.status !== 'live'; });

  function kort(t){
    var erLenke = t.status === 'live' && t.adresse;
    var tagg = erLenke ? 'a' : 'div';
    var attr = erLenke ? ' href="' + esc(t.adresse) + '"' : '';
    return '<' + tagg + ' class="tjeneste' + (erLenke ? '' : ' snart') + '"' + attr + '>'
      + '<span class="ikon">' + esc(t.ikon || '•') + '</span>'
      + (erLenke ? '<span class="pil">→</span>' : '')
      + '<h3>' + esc(t.navn) + '</h3>'
      + '<p>' + esc(t.beskrivelse) + '</p>'
      + (erLenke ? '' : '<span class="merke">kommer</span>')
      + '</' + tagg + '>';
  }

  // to ekte beholdere, ikke én med et påklistret div-bytte inni: nettleseren
  // kaster ubalanserte tagger i innerHTML, og overskriften havnet som et
  // element inne i rutenettet
  function fyll(overskriftId, listeId, poster){
    document.getElementById(overskriftId).hidden = !poster.length;
    document.getElementById(listeId).innerHTML = poster.map(kort).join('');
  }
  fyll('overskriftLive', 'liste', live);
  fyll('overskriftSnart', 'listeSnart', snart);
})();
</script>
</body>
</html>
